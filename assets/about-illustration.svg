<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E2CC"/>
      <stop offset="100%" stop-color="#DCD3B4"/>
    </linearGradient>
    <linearGradient id="deskWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B98552"/>
      <stop offset="100%" stop-color="#8F6238"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7DE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFF7DE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bookTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B5A3C"/>
      <stop offset="100%" stop-color="#123D2B"/>
    </linearGradient>
    <linearGradient id="bookDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#123D2B"/>
      <stop offset="100%" stop-color="#0A2A1D"/>
    </linearGradient>
    <linearGradient id="bookSage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FBF8A"/>
      <stop offset="100%" stop-color="#2B6E4C"/>
    </linearGradient>
    <linearGradient id="mugBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF4"/>
      <stop offset="100%" stop-color="#F1EBD9"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FBF8A"/>
      <stop offset="100%" stop-color="#123D2B"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="55%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#FFF7DE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF7DE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wall background fills full frame -->
  <rect width="800" height="840" fill="url(#bgWall)"/>
  <rect x="440" y="0" width="360" height="840" fill="url(#windowLight)"/>
  <circle cx="640" cy="90" r="360" fill="url(#softGlow)"/>

  <!-- window frame lines, reaching near top -->
  <g stroke="#C9BE9C" stroke-width="4" opacity="0.55">
    <line x1="520" y1="0" x2="520" y2="380"/>
    <line x1="660" y1="0" x2="660" y2="380"/>
    <line x1="440" y1="150" x2="800" y2="150"/>
  </g>

  <!-- back wall shelf, filling upper-left dead space -->
  <g transform="translate(60,40)">
    <rect x="0" y="0" width="230" height="10" fill="#C9BE9C"/>
    <rect x="8" y="-92" width="34" height="92" rx="3" fill="url(#bookSage)"/>
    <rect x="48" y="-118" width="34" height="118" rx="3" fill="url(#bookTeal)"/>
    <rect x="88" y="-78" width="34" height="78" rx="3" fill="url(#bookDark)"/>
    <rect x="128" y="-104" width="34" height="104" rx="3" fill="url(#bookSage)"/>
    <circle cx="200" cy="-46" r="46" fill="#F1EBD9" opacity="0.7"/>
  </g>

  <!-- large potted plant, back left, taller to fill height -->
  <g transform="translate(120,430)">
    <path d="M-52 130 L52 130 L40 0 L-40 0 Z" fill="#E9DFCA" stroke="#C9BE9C" stroke-width="2"/>
    <g fill="url(#leafGrad)">
      <path d="M0 0 C-80 -60 -95 -160 -40 -220 C-12 -150 -12 -60 0 0 Z"/>
      <path d="M0 0 C70 -75 105 -175 55 -230 C15 -160 0 -70 0 0 Z"/>
      <path d="M0 0 C-25 -100 10 -190 55 -215 C75 -145 40 -55 0 0 Z"/>
      <path d="M0 0 C20 -85 -15 -165 -62 -185 C-80 -120 -50 -50 0 0 Z"/>
    </g>
  </g>

  <!-- desk surface, larger portion of frame -->
  <rect x="0" y="520" width="800" height="320" fill="url(#deskWood)"/>
  <rect x="0" y="520" width="800" height="12" fill="#6B4423" opacity="0.5"/>
  <g stroke="#7A4F29" stroke-width="2" opacity="0.35">
    <line x1="0" y1="565" x2="800" y2="561"/>
    <line x1="0" y1="620" x2="800" y2="617"/>
    <line x1="0" y1="690" x2="800" y2="687"/>
    <line x1="0" y1="760" x2="800" y2="757"/>
    <line x1="0" y1="810" x2="800" y2="808"/>
  </g>

  <!-- office chair silhouette, back right -->
  <g transform="translate(700,400)" opacity="0.9">
    <rect x="-78" y="-100" width="156" height="170" rx="26" fill="#1C2C24"/>
    <rect x="-66" y="70" width="20" height="80" fill="#14201C"/>
    <rect x="46" y="70" width="20" height="80" fill="#14201C"/>
  </g>

  <!-- laptop, back center -->
  <g transform="translate(440,470)">
    <path d="M-104 68 L104 68 L116 90 L-116 90 Z" fill="#123D2B"/>
    <rect x="-90" y="-60" width="180" height="128" rx="7" fill="#123B2C"/>
    <rect x="-78" y="-48" width="156" height="104" rx="4" fill="#0A2A1D"/>
  </g>

  <!-- stack of books, right of mug, bigger -->
  <g transform="translate(540,530)">
    <rect x="0" y="0" width="230" height="42" rx="5" fill="url(#bookDark)"/>
    <text x="115" y="28" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#F5EEDF">GROWTH</text>

    <rect x="14" y="-38" width="202" height="42" rx="5" fill="url(#bookTeal)"/>
    <text x="115" y="-10" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#F5EEDF">CULTURE</text>

    <rect x="28" y="-78" width="174" height="42" rx="5" fill="url(#bookSage)"/>
    <text x="115" y="-50" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#0A2A1D">TALENT</text>
  </g>

  <!-- coffee mug, front left, bigger -->
  <g transform="translate(300,610)">
    <ellipse cx="0" cy="140" rx="98" ry="17" fill="#000" opacity="0.14"/>
    <path d="M-86 -36 L86 -36 L77 120 C77 141 -77 141 -77 120 Z" fill="url(#mugBody)" stroke="#DCD3B4" stroke-width="2"/>
    <ellipse cx="0" cy="-36" rx="86" ry="17" fill="#FBF7EA" stroke="#DCD3B4" stroke-width="2"/>
    <ellipse cx="0" cy="-36" rx="86" ry="17" fill="#3A2A18" opacity="0.55"/>
    <ellipse cx="0" cy="-41" rx="72" ry="12" fill="#5C4326"/>
    <path d="M77 -6 C144 -6 144 88 77 88" fill="none" stroke="#F1EBD9" stroke-width="19" stroke-linecap="round"/>
    <path d="M77 -6 C144 -6 144 88 77 88" fill="none" stroke="#DCD3B4" stroke-width="2"/>
    <text x="0" y="22" text-anchor="middle" font-family="'Fraunces',Georgia,serif" font-style="italic" font-size="20" fill="#123D2B">Better</text>
    <text x="0" y="50" text-anchor="middle" font-family="'Fraunces',Georgia,serif" font-style="italic" font-size="20" fill="#123D2B">People</text>
    <text x="0" y="78" text-anchor="middle" font-family="'Fraunces',Georgia,serif" font-style="italic" font-size="20" fill="#2B6E4C">Stronger</text>
    <text x="0" y="106" text-anchor="middle" font-family="'Fraunces',Georgia,serif" font-style="italic" font-size="20" fill="#2B6E4C">Businesses</text>
  </g>

  <!-- small succulent, front right corner -->
  <g transform="translate(710,690)">
    <path d="M-26 48 L26 48 L20 0 L-20 0 Z" fill="#F1EBD9" stroke="#DCD3B4" stroke-width="2"/>
    <g fill="#2B6E4C">
      <ellipse cx="0" cy="-8" rx="12" ry="32" transform="rotate(-18 0 -8)"/>
      <ellipse cx="0" cy="-8" rx="12" ry="32" transform="rotate(18 0 -8)"/>
      <ellipse cx="0" cy="-12" rx="11" ry="30"/>
    </g>
  </g>

  <!-- ambient dust / light dots -->
  <g fill="#FFF7DE" opacity="0.55">
    <circle cx="560" cy="70" r="3.5"/>
    <circle cx="630" cy="180" r="2.5"/>
    <circle cx="710" cy="40" r="3"/>
    <circle cx="500" cy="20" r="2.5"/>
  </g>
</svg>
