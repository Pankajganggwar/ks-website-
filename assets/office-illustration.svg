<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCEFE6"/>
      <stop offset="100%" stop-color="#F5EEDF"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF7EF"/>
      <stop offset="100%" stop-color="#F2EADA"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9CFAE"/>
      <stop offset="100%" stop-color="#C7BB94"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B98552"/>
      <stop offset="100%" stop-color="#8F6238"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFE6DC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#CFE6DC" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FBF8A"/>
      <stop offset="100%" stop-color="#123D2B"/>
    </linearGradient>
    <linearGradient id="buildGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9C9BC"/>
      <stop offset="100%" stop-color="#8FB6A6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7DE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF7DE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- back wall -->
  <rect width="1600" height="1000" fill="url(#wallGrad)"/>

  <!-- floor -->
  <rect x="0" y="760" width="1600" height="240" fill="url(#floorGrad)"/>
  <g stroke="#B7AA82" stroke-width="2" opacity="0.4">
    <line x1="0" y1="820" x2="1600" y2="816"/>
    <line x1="0" y1="890" x2="1600" y2="886"/>
    <line x1="0" y1="960" x2="1600" y2="956"/>
  </g>

  <!-- LEFT: floor-to-ceiling window with skyline -->
  <g>
    <rect x="40" y="60" width="480" height="700" rx="6" fill="url(#skyGrad)"/>
    <g fill="url(#buildGrad)" opacity="0.85">
      <rect x="70" y="360" width="60" height="300"/>
      <rect x="140" y="300" width="50" height="360"/>
      <rect x="200" y="400" width="70" height="260"/>
      <rect x="280" y="260" width="55" height="400"/>
      <rect x="345" y="340" width="65" height="320"/>
      <rect x="420" y="380" width="60" height="280"/>
    </g>
    <circle cx="440" cy="150" r="120" fill="url(#sunGlow)"/>
    <!-- window mullions -->
    <g stroke="#DCD3B4" stroke-width="6">
      <line x1="280" y1="60" x2="280" y2="760"/>
      <line x1="40" y1="410" x2="520" y2="410"/>
    </g>
  </g>

  <!-- ceiling beams -->
  <g stroke="#B98552" stroke-width="14" opacity="0.85">
    <line x1="0" y1="40" x2="1600" y2="40"/>
    <line x1="0" y1="80" x2="1600" y2="80"/>
  </g>
  <g fill="#5E7469">
    <rect x="150" y="80" width="6" height="60"/>
    <circle cx="153" cy="150" r="26" fill="#14201C"/>
    <rect x="480" y="80" width="6" height="70"/>
    <circle cx="483" cy="160" r="26" fill="#14201C"/>
  </g>

  <!-- potted plants scattered -->
  <g transform="translate(560,700)">
    <path d="M-30 80 L30 80 L24 0 L-24 0 Z" fill="#E9DFCA"/>
    <g fill="url(#leafGrad2)">
      <path d="M0 0 C-40 -30 -50 -80 -20 -110 C-6 -70 -6 -30 0 0 Z"/>
      <path d="M0 0 C35 -35 50 -85 25 -115 C8 -75 0 -30 0 0 Z"/>
    </g>
  </g>
  <g transform="translate(1080,720)">
    <path d="M-26 68 L26 68 L20 0 L-20 0 Z" fill="#E9DFCA"/>
    <g fill="url(#leafGrad2)">
      <path d="M0 0 C-34 -26 -42 -68 -16 -94 C-5 -60 -5 -25 0 0 Z"/>
      <path d="M0 0 C30 -30 42 -72 20 -98 C6 -64 0 -26 0 0 Z"/>
    </g>
  </g>

  <!-- center: meeting table with laptop, mugs, papers -->
  <g transform="translate(760,780)">
    <ellipse cx="0" cy="66" rx="230" ry="20" fill="#000" opacity="0.08"/>
    <path d="M-260 20 L260 20 L230 60 L-230 60 Z" fill="url(#deskGrad)"/>
    <rect x="-230" y="0" width="460" height="24" rx="4" fill="url(#deskGrad)"/>

    <!-- laptop -->
    <g transform="translate(-90,-70)">
      <path d="M-58 40 L58 40 L66 54 L-66 54 Z" fill="#123D2B"/>
      <rect x="-50" y="-34" width="100" height="74" rx="4" fill="#123B2C"/>
      <rect x="-42" y="-26" width="84" height="58" rx="2" fill="#0A2A1D"/>
    </g>

    <!-- open notebook -->
    <g transform="translate(70,-8)">
      <rect x="-46" y="-6" width="92" height="30" rx="3" fill="#FBF7EA" stroke="#DCD3B4" stroke-width="1.5"/>
      <line x1="0" y1="-6" x2="0" y2="24" stroke="#DCD3B4" stroke-width="1.5"/>
    </g>

    <!-- two coffee cups -->
    <g transform="translate(150,-6)">
      <path d="M-14 -18 L14 -18 L12 10 C12 18 -12 18 -12 10 Z" fill="#FBF7EA" stroke="#DCD3B4"/>
    </g>
    <g transform="translate(-170,-4)">
      <path d="M-14 -18 L14 -18 L12 10 C12 18 -12 18 -12 10 Z" fill="#FBF7EA" stroke="#DCD3B4"/>
    </g>
  </g>

  <!-- people around the table, simple geometric figures -->
  <g fill="url(#leafGrad2)">
    <!-- person 1 -->
    <g transform="translate(560,650)">
      <circle cx="0" cy="0" r="30"/>
      <path d="M-50 220 C-50 130 -35 84 0 84 C35 84 50 130 50 220 Z"/>
    </g>
    <!-- person 2 -->
    <g transform="translate(660,630)">
      <circle cx="0" cy="0" r="34"/>
      <path d="M-58 250 C-58 148 -40 96 0 96 C40 96 58 148 58 250 Z"/>
    </g>
    <!-- person 3 -->
    <g transform="translate(870,630)">
      <circle cx="0" cy="0" r="34"/>
      <path d="M-58 250 C-58 148 -40 96 0 96 C40 96 58 148 58 250 Z"/>
    </g>
    <!-- person 4 -->
    <g transform="translate(970,650)">
      <circle cx="0" cy="0" r="30"/>
      <path d="M-50 220 C-50 130 -35 84 0 84 C35 84 50 130 50 220 Z"/>
    </g>
  </g>

  <!-- RIGHT: glass-walled meeting room with HR signage -->
  <g>
    <rect x="1180" y="60" width="380" height="700" fill="url(#glassGrad)" stroke="#B7AA82" stroke-width="4"/>
    <g stroke="#B7AA82" stroke-width="4">
      <line x1="1180" y1="260" x2="1560" y2="260"/>
      <line x1="1370" y1="60" x2="1370" y2="760"/>
    </g>
    <text x="1260" y="180" font-family="Poppins,Arial,sans-serif" font-size="34" font-weight="700" fill="#123D2B" opacity="0.85">HR</text>
    <!-- small sticky notes on glass -->
    <g>
      <rect x="1420" y="130" width="26" height="26" fill="#4FBF8A" opacity="0.8" transform="rotate(-6 1433 143)"/>
      <rect x="1455" y="120" width="26" height="26" fill="#9A7B46" opacity="0.7" transform="rotate(5 1468 133)"/>
      <rect x="1440" y="160" width="26" height="26" fill="#1B5A3C" opacity="0.75" transform="rotate(-3 1453 173)"/>
    </g>
    <!-- silhouette figures inside meeting room -->
    <g fill="#123D2B" opacity="0.55">
      <circle cx="1250" cy="480" r="22"/>
      <path d="M1210 620 C1210 550 1226 510 1250 510 C1274 510 1290 550 1290 620 Z"/>
      <circle cx="1330" cy="470" r="22"/>
      <path d="M1290 610 C1290 540 1306 500 1330 500 C1354 500 1370 540 1370 610 Z"/>
    </g>
    <!-- desks visible through glass, back right -->
    <g fill="#123D2B" opacity="0.35">
      <rect x="1420" y="560" width="120" height="14" rx="3"/>
      <rect x="1420" y="560" width="120" height="14" rx="3" transform="translate(0,60)"/>
    </g>
  </g>

  <!-- ambient light dots -->
  <g fill="#FFF7DE" opacity="0.6">
    <circle cx="700" cy="120" r="3"/>
    <circle cx="900" cy="90" r="2.5"/>
    <circle cx="1050" cy="140" r="3"/>
  </g>
</svg>
