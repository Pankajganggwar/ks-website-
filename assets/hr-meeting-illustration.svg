<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hrBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F3E7"/>
      <stop offset="100%" stop-color="#EDE7D3"/>
    </linearGradient>
    <linearGradient id="hrDesk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B98552"/>
      <stop offset="100%" stop-color="#8F6238"/>
    </linearGradient>
    <linearGradient id="hrPersonA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F6B4A"/>
      <stop offset="100%" stop-color="#0E3830"/>
    </linearGradient>
    <linearGradient id="hrPersonB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FBF8A"/>
      <stop offset="100%" stop-color="#145C42"/>
    </linearGradient>
    <linearGradient id="hrPersonC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C6B21"/>
      <stop offset="100%" stop-color="#6B5119"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3EEDD"/>
    </linearGradient>
    <radialGradient id="hrGlow" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFF7DE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF7DE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="760" fill="url(#hrBg)"/>
  <circle cx="700" cy="120" r="280" fill="url(#hrGlow)"/>

  <!-- faint grid -->
  <g stroke="#0E3830" stroke-opacity="0.04">
    <line x1="0" y1="120" x2="900" y2="120"/><line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="360" x2="900" y2="360"/><line x1="0" y1="480" x2="900" y2="480"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="760"/><line x1="300" y1="0" x2="300" y2="760"/>
    <line x1="450" y1="0" x2="450" y2="760"/><line x1="600" y1="0" x2="600" y2="760"/>
    <line x1="750" y1="0" x2="750" y2="760"/>
  </g>

  <!-- back wall decor: framed HR value cards -->
  <g transform="translate(90,90)">
    <rect width="150" height="100" rx="8" fill="#fff" stroke="#E7DFC8" stroke-width="2"/>
    <text x="75" y="45" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="13" font-weight="700" fill="#0E3830">POLICY</text>
    <text x="75" y="66" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="11" fill="#7C8C86">Updated 2026</text>
  </g>
  <g transform="translate(270,70)">
    <rect width="130" height="80" rx="8" fill="#0E3830"/>
    <text x="65" y="35" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">COMPLIANCE</text>
    <text x="65" y="55" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="10" fill="#8BE0BA">EPF · ESI · TDS</text>
  </g>

  <!-- meeting table -->
  <g transform="translate(450,560)">
    <ellipse cx="0" cy="60" rx="320" ry="26" fill="#000" opacity="0.08"/>
    <path d="M-340 0 L340 0 L300 60 L-300 60 Z" fill="url(#hrDesk)"/>
    <rect x="-340" y="-22" width="680" height="24" rx="4" fill="url(#hrDesk)"/>

    <!-- tablet showing HR chart, held up center -->
    <g transform="translate(0,-80)">
      <rect x="-70" y="-50" width="140" height="100" rx="10" fill="#0E3830"/>
      <rect x="-60" y="-40" width="120" height="80" rx="4" fill="#fff"/>
      <text x="0" y="-22" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="9" font-weight="700" fill="#0E3830">HR ANALYTICS</text>
      <g fill="#1F6B4A">
        <rect x="-46" y="0" width="14" height="24"/>
        <rect x="-26" y="-14" width="14" height="38"/>
        <rect x="-6" y="6" width="14" height="18"/>
        <rect x="14" y="-20" width="14" height="44"/>
        <rect x="34" y="-6" width="14" height="30"/>
      </g>
    </g>

    <!-- folders and documents on table -->
    <g transform="translate(-180,-6)">
      <rect x="-30" y="-20" width="60" height="42" rx="3" fill="url(#cardGrad)" stroke="#DCD3B4"/>
      <rect x="-24" y="-12" width="48" height="4" fill="#C9BE9C"/>
      <rect x="-24" y="-2" width="36" height="4" fill="#C9BE9C"/>
    </g>
    <g transform="translate(190,-4)">
      <rect x="-34" y="-6" width="68" height="46" rx="3" fill="url(#cardGrad)" stroke="#DCD3B4"/>
      <path d="M-34 -6 L0 14 L34 -6" fill="none" stroke="#DCD3B4"/>
    </g>

    <!-- coffee cup -->
    <g transform="translate(280,4)">
      <path d="M-13 -16 L13 -16 L11 8 C11 15 -11 15 -11 8 Z" fill="#FBF7EA" stroke="#DCD3B4"/>
    </g>
  </g>

  <!-- four people around the table -->
  <g>
    <!-- person 1, left, seated -->
    <g transform="translate(200,480)" fill="url(#hrPersonA)">
      <circle cx="0" cy="0" r="38"/>
      <path d="M-64 260 C-64 152 -44 98 0 98 C44 98 64 152 64 260 Z"/>
    </g>
    <!-- person 2, left-center, standing / presenting -->
    <g transform="translate(340,430)" fill="url(#hrPersonB)">
      <circle cx="0" cy="0" r="42"/>
      <path d="M-70 310 C-70 182 -48 116 0 116 C48 116 70 182 70 310 Z"/>
    </g>
    <!-- person 3, right-center, seated, pointing at tablet -->
    <g transform="translate(560,430)" fill="url(#hrPersonC)">
      <circle cx="0" cy="0" r="42"/>
      <path d="M-70 310 C-70 182 -48 116 0 116 C48 116 70 182 70 310 Z"/>
    </g>
    <!-- person 4, right, seated -->
    <g transform="translate(700,480)" fill="url(#hrPersonA)">
      <circle cx="0" cy="0" r="38"/>
      <path d="M-64 260 C-64 152 -44 98 0 98 C44 98 64 152 64 260 Z"/>
    </g>
  </g>

  <!-- handshake icon floating, symbolizing HR partnership -->
  <g transform="translate(450,220)" opacity="0.9">
    <circle cx="0" cy="0" r="46" fill="#fff" stroke="#E7DFC8" stroke-width="2"/>
    <path d="M-20 4 L-6 -8 L4 0 L20 -12" stroke="#1F6B4A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-20 4 L-8 14 L2 6 L20 -12" stroke="#0E3830" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ambient dots -->
  <g fill="#FFF7DE" opacity="0.7">
    <circle cx="620" cy="140" r="3"/>
    <circle cx="680" cy="220" r="2.5"/>
    <circle cx="540" cy="90" r="2.5"/>
  </g>
</svg>
