<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2A1D"/>
      <stop offset="55%" stop-color="#123D2B"/>
      <stop offset="100%" stop-color="#123B2C"/>
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A2A1D" stop-opacity="1"/>
      <stop offset="38%" stop-color="#0A2A1D" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#0A2A1D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="personGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B6E4C"/>
      <stop offset="100%" stop-color="#1B5A3C"/>
    </linearGradient>
    <linearGradient id="personGradDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123D2B"/>
      <stop offset="100%" stop-color="#2B6E4C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B5A3C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1B5A3C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1920" height="1000" fill="url(#bgGrad)"/>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.035">
    <g>
      <line x1="0" y1="80" x2="1920" y2="80"/><line x1="0" y1="160" x2="1920" y2="160"/>
      <line x1="0" y1="240" x2="1920" y2="240"/><line x1="0" y1="320" x2="1920" y2="320"/>
      <line x1="0" y1="400" x2="1920" y2="400"/><line x1="0" y1="480" x2="1920" y2="480"/>
      <line x1="0" y1="560" x2="1920" y2="560"/><line x1="0" y1="640" x2="1920" y2="640"/>
      <line x1="0" y1="720" x2="1920" y2="720"/><line x1="0" y1="800" x2="1920" y2="800"/>
      <line x1="0" y1="880" x2="1920" y2="880"/><line x1="0" y1="960" x2="1920" y2="960"/>
    </g>
    <g>
      <line x1="80" y1="0" x2="80" y2="1000"/><line x1="160" y1="0" x2="160" y2="1000"/>
      <line x1="240" y1="0" x2="240" y2="1000"/><line x1="320" y1="0" x2="320" y2="1000"/>
      <line x1="400" y1="0" x2="400" y2="1000"/><line x1="480" y1="0" x2="480" y2="1000"/>
      <line x1="560" y1="0" x2="560" y2="1000"/><line x1="640" y1="0" x2="640" y2="1000"/>
      <line x1="720" y1="0" x2="720" y2="1000"/><line x1="800" y1="0" x2="800" y2="1000"/>
      <line x1="880" y1="0" x2="880" y2="1000"/><line x1="960" y1="0" x2="960" y2="1000"/>
      <line x1="1040" y1="0" x2="1040" y2="1000"/><line x1="1120" y1="0" x2="1120" y2="1000"/>
      <line x1="1200" y1="0" x2="1200" y2="1000"/><line x1="1280" y1="0" x2="1280" y2="1000"/>
      <line x1="1360" y1="0" x2="1360" y2="1000"/><line x1="1440" y1="0" x2="1440" y2="1000"/>
      <line x1="1520" y1="0" x2="1520" y2="1000"/><line x1="1600" y1="0" x2="1600" y2="1000"/>
      <line x1="1680" y1="0" x2="1680" y2="1000"/><line x1="1760" y1="0" x2="1760" y2="1000"/>
      <line x1="1840" y1="0" x2="1840" y2="1000"/>
    </g>
  </g>

  <circle cx="1500" cy="280" r="380" fill="url(#glow)"/>
  <circle cx="1250" cy="750" r="260" fill="url(#glow)"/>

  <!-- connecting network lines between figures (technology + teamwork motif) -->
  <g stroke="#4FBF8A" stroke-opacity="0.3" stroke-width="2" fill="none">
    <path d="M980 760 L1150 620 L1330 700 L1520 560 L1700 640"/>
    <path d="M1150 620 L1150 480"/>
    <path d="M1330 700 L1330 560"/>
    <path d="M1520 560 L1520 420"/>
  </g>
  <g fill="#4FBF8A" fill-opacity="0.55">
    <circle cx="1150" cy="480" r="5"/><circle cx="1330" cy="560" r="5"/>
    <circle cx="1520" cy="420" r="5"/><circle cx="980" cy="760" r="5"/>
    <circle cx="1700" cy="640" r="5"/>
  </g>

  <!-- abstract workforce figures (simple geometric people, standing together) -->
  <!-- figure 1 (back, dim) -->
  <g transform="translate(1000,560)" fill="url(#personGradDim)">
    <circle cx="0" cy="0" r="34"/>
    <path d="M-58 260 C-58 150 -40 96 0 96 C40 96 58 150 58 260 Z"/>
  </g>
  <!-- figure 2 -->
  <g transform="translate(1130,540)" fill="url(#personGrad)">
    <circle cx="0" cy="0" r="40"/>
    <path d="M-68 300 C-68 175 -47 112 0 112 C47 112 68 175 68 300 Z"/>
  </g>
  <!-- figure 3 (front, largest / lead figure) -->
  <g transform="translate(1290,555)" fill="url(#personGrad)">
    <circle cx="0" cy="0" r="46"/>
    <path d="M-78 340 C-78 200 -54 128 0 128 C54 128 78 200 78 340 Z"/>
  </g>
  <!-- figure 4 -->
  <g transform="translate(1460,545)" fill="url(#personGradDim)">
    <circle cx="0" cy="0" r="38"/>
    <path d="M-64 290 C-64 168 -44 108 0 108 C44 108 64 168 64 290 Z"/>
  </g>
  <!-- figure 5 (back right, dim, partially cropped) -->
  <g transform="translate(1620,565)" fill="url(#personGradDim)">
    <circle cx="0" cy="0" r="32"/>
    <path d="M-54 245 C-54 142 -37 92 0 92 C37 92 54 142 54 245 Z"/>
  </g>

  <!-- ground shadow / platform line -->
  <rect x="880" y="895" width="900" height="4" fill="#4FBF8A" fill-opacity="0.25"/>

  <!-- left fade so hero text stays readable -->
  <rect width="1920" height="1000" fill="url(#fadeLeft)"/>
</svg>
